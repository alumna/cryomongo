name: Specs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - topology: standalone
            uri: mongodb://localhost:27017/?compressors=zlib
          - topology: replicaset
            uri: mongodb://localhost:27017/?replicaSet=rs0&compressors=zlib
          - topology: sharded
            uri: mongodb://localhost:27017,localhost:27016/?compressors=zlib
          - topology: load-balanced
            uri: mongodb://127.0.0.1:8000/?loadBalanced=true&compressors=zlib
    runs-on: ubuntu-24.04
    name: MongoDB 8.0 ${{ matrix.topology }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start MongoDB ${{ matrix.topology }} (8.0)
        run: scripts/docker-topology.sh ${{ matrix.topology }}
      - name: Install HAProxy (load-balanced)
        if: matrix.topology == 'load-balanced'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y haproxy
          spec/support/run-load-balancer.sh start
          cat tmp/lb-uri.env

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install dependencies
        run: shards install

      - name: Run Specs
        env:
          TOPOLOGY: ${{ matrix.topology }}
          MONGODB_URI: ${{ matrix.uri }}
          SINGLE_MONGOS_LB_URI: mongodb://127.0.0.1:8000/?loadBalanced=true&compressors=zlib
          MULTI_MONGOS_LB_URI: mongodb://127.0.0.1:8001/?loadBalanced=true&compressors=zlib
          UTF_TIMING_LOG: tmp/utf-timing.log
          CRYSTAL_WORKERS: "2"
        run: |
          mkdir -p tmp
          crystal spec -Dpreview_mt -Dexecution_context

      - name: Upload UTF timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utf-timing-${{ matrix.topology }}
          path: tmp/utf-timing.log
          if-no-files-found: ignore
