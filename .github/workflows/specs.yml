name: Specs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    # Use the matrix strategy when needing to split/shard the tests
    # to reduce the total execution time by running tests in parallel

    #strategy:
    #  fail-fast: false
    #  matrix:
    #    part: [0, 1, 2, 3, 4] # This creates 4 concurrent jobs

    runs-on: ubuntu-24.04
    name: MongoDB 8.0 replica set
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start MongoDB ReplicaSet (8.0)
        run: |
          # One-node replica set. Same topology as local scripts/mongo-rs.sh.
          docker run --name mongo -d -p 27017:27017 --tmpfs /data/db mongo:8.0 \
            --replSet rs0 \
            --setParameter enableTestCommands=1 \
            --setParameter acceptApiVersion2=1
          sleep 5
          docker exec mongo mongosh --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          sleep 5

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install dependencies
        run: shards install

      - name: Run Specs
        # The full suite is about 6–7 minutes. Do not set CI_SHARD.
        # spec/sharding.cr still honors CI_SHARD="N/M" if the suite grows
        # and you add a matrix again.
        run: crystal spec

        # SHARDED TEST EXECUTION
        # Pass the matrix part into the custom sharding logic
        # run: CI_SHARD="${{ matrix.part }}/5" crystal spec
