name: Specs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - topology: standalone
            uri: mongodb://localhost:27017
          - topology: replicaset
            uri: mongodb://localhost:27017/?replicaSet=rs0
          - topology: sharded
            uri: mongodb://localhost:27017
    runs-on: ubuntu-24.04
    name: MongoDB 8.0 ${{ matrix.topology }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start MongoDB ${{ matrix.topology }} (8.0)
        env:
          TOPOLOGY: ${{ matrix.topology }}
        run: |
          set -euo pipefail
          PARAMS="--setParameter enableTestCommands=1 --setParameter acceptApiVersion2=1 --setParameter transactionLifetimeLimitSeconds=20"
          case "$TOPOLOGY" in
            standalone)
              docker run --name mongo -d -p 27017:27017 --tmpfs /data/db mongo:8.0 $PARAMS
              ;;
            replicaset)
              docker run --name mongo -d -p 27017:27017 --tmpfs /data/db mongo:8.0 --replSet rs0 $PARAMS
              sleep 5
              docker exec mongo mongosh --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
              ;;
            sharded)
              docker network create mongo-test
              docker run -d --name cfg --network mongo-test --network-alias cfg --tmpfs /data/db mongo:8.0 \
                mongod --configsvr --replSet cfg --port 27019 --bind_ip_all $PARAMS
              docker run -d --name shard --network mongo-test --network-alias shard --tmpfs /data/db mongo:8.0 \
                mongod --shardsvr --replSet shard0 --port 27018 --bind_ip_all $PARAMS
              sleep 8
              docker exec cfg mongosh --port 27019 --eval 'rs.initiate({_id:"cfg",configsvr:true,members:[{_id:0,host:"cfg:27019"}]})'
              docker exec shard mongosh --port 27018 --eval 'rs.initiate({_id:"shard0",members:[{_id:0,host:"shard:27018"}]})'
              for _ in $(seq 1 30); do
                docker exec cfg mongosh --port 27019 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break
                sleep 1
              done
              for _ in $(seq 1 30); do
                docker exec shard mongosh --port 27018 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break
                sleep 1
              done
              docker run -d --name mongos --network mongo-test -p 27017:27017 mongo:8.0 \
                mongos --configdb cfg/cfg:27019 --bind_ip_all $PARAMS
              sleep 5
              docker exec mongos mongosh --eval 'sh.addShard("shard0/shard:27018")'
              ;;
          esac
          for _ in $(seq 1 40); do
            if mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then
              exit 0
            fi
            # mongosh may not be on the runner; probe with docker
            if [ "$TOPOLOGY" = "sharded" ]; then
              docker exec mongos mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1 && exit 0
            elif docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB did not become ready" >&2
          exit 1

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install dependencies
        run: shards install

      - name: Run Specs
        env:
          TOPOLOGY: ${{ matrix.topology }}
          MONGODB_URI: ${{ matrix.uri }}
        run: crystal spec
