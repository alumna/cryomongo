name: Specs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3] # This creates 4 concurrent jobs
    runs-on: ubuntu-24.04
    name: Mongodb tests (Shard ${{ matrix.part }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start MongoDB ReplicaSet (8.0)
        run: |
          # Start a persistent Replica Set for the Unified Test Runner (Using tmpfs for I/O speed)
          docker run --name mongo -d -p 27017:27017 --tmpfs /data/db mongo:8.0 --replSet rs0 --setParameter enableTestCommands=1
          sleep 5
          docker exec mongo mongosh --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          sleep 5

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install dependencies
        run: shards install

      - name: Run Specs
        # Pass the matrix part into our custom sharding logic!
        run: SPEC_SPLIT="${{ matrix.part }}%4" crystal spec
