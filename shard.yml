name: cryomongo
version: 0.17.5

authors:
  - elbywan <elbywan@hotmail.com>

crystal: ">= 1.20.0"

license: MIT

# CSFLE links official libmongocrypt 1.20.4 from vendor/libmongocrypt
# (run scripts/vendor-libmongocrypt.sh). USE_SYSTEM_LIBMONGOCRYPT=true uses
# pkg-config / system -lmongocrypt (>= 1.20.0). Compile with
# -Dwithout_libmongocrypt to skip. Do not use GitHub Ubuntu 24.04 apt for the
# default link (missing mongocrypt_setopt_key_expiration and related APIs).

dependencies:
  # Wave 58 document class is Unreleased on bson.cr 0.9.2. GitHub CI must
  # use master until the next bson tag. Local specs use shard.override.yml.
  bson:
    github: alumna/bson.cr
    branch: master
  pipe:
    github: jgaskins/pipe
  dns:
    github: spider-gazelle/dns
    branch: main
  snappy:
    github: naqvis/snappy
    version: "~> 0.2.0"
  zstd:
    github: didactic-drunk/zstd.cr
    version: "~> 1.2.0"

targets:
  cryomongo:
    main: src/cryomongo.cr
  driver_bench:
    main: bench/driver_bench.cr

crystalline:
  main: .crystalline_main.cr
